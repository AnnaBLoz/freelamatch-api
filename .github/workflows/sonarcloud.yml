name: .NET 8 CI with SonarCloud

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION_FILE: freela-match-api/freela-match-api.sln
  SONAR_PROJECT_KEY: AnnaBLoz_freelamatch-api
  SONAR_ORG: annabloz

permissions:
  pull-requests: write
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: windows-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: .sonar/scanner
          key: ${{ runner.os }}-sonar-scanner-${{ hashFiles('**/global.json', '**/nuget.config') }}
          restore-keys: ${{ runner.os }}-sonar-scanner-

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -Path .sonar/scanner -ItemType Directory -Force
          dotnet tool update --tool-path .sonar/scanner dotnet-sonarscanner

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: SonarCloud Begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          $workDir = Get-Location
          Write-Host "Running Sonar Begin in $workDir"
          .\.sonar\scanner\dotnet-sonarscanner begin `
            /k:"${{ env.SONAR_PROJECT_KEY }}" `
            /o:"${{ env.SONAR_ORG }}" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.sources="freela-match-api" `
            /d:sonar.cs.opencover.reportsPaths="$workDir\freela-match-api-test\TestResults\**\coverage.opencover.xml,$workDir\coverage.opencover.xml" `
            /d:sonar.cs.vstest.reportsPaths="$workDir\freela-match-api-test\TestResults\**\*.trx" `
            /d:sonar.exclusions="**/Migrations/**,**/Program.cs,**/obj/**,**/bin/**" `
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs" `
            /d:sonar.verbose=true

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_FILE }} --no-restore --configuration Release

      - name: Run tests with coverage
        shell: pwsh
        run: |
          Write-Host "=== Running tests with coverage ==="

          if (Test-Path "freela-match-api-test/TestResults") {
            Remove-Item -Recurse -Force "freela-match-api-test/TestResults"
          }

          dotnet test freela-match-api-test/freela-match-api-test.csproj `
            --no-build `
            --configuration Release `
            --collect:"XPlat Code Coverage" `
            --results-directory freela-match-api-test/TestResults `
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

          Write-Host "=== Searching for coverage file ==="
          $coverageFile = Get-ChildItem -Recurse -Filter "coverage.opencover.xml" -Path freela-match-api-test\TestResults | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          
          if ($coverageFile) {
            $dest = Join-Path (Get-Location) "coverage.opencover.xml"
            Copy-Item $coverageFile.FullName $dest -Force
            Write-Host "Copied coverage file to: $dest"
            Write-Host "File size: $((Get-Item $dest).Length) bytes"
          } else {
            Write-Host "ERROR: Coverage file not found!"
            Get-ChildItem -Path freela-match-api-test\TestResults -Recurse | Select-Object FullName
            exit 1
          }

      - name: Verify coverage file
        shell: pwsh
        run: |
          if (Test-Path "coverage.opencover.xml") {
            Write-Host "Coverage file found at root."
            Write-Host "Full path: $(Resolve-Path 'coverage.opencover.xml')"
            Write-Host "Size: $((Get-Item 'coverage.opencover.xml').Length) bytes"
            Write-Host "First 10 lines of file:"
            Get-Content "coverage.opencover.xml" -Head 10
          } else {
            Write-Host "ERROR: coverage.opencover.xml not found!"
            exit 1
          }

      - name: SonarCloud End
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

      - name: Upload coverage as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.*.xml
            freela-match-api-test/TestResults/**/*.xml
          retention-days: 5

  build:
    name: Build & Test (fast)
    needs: sonarcloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --no-restore --configuration Release

      - name: Test
        run: dotnet test ${{ env.SOLUTION_FILE }} --no-build --configuration Release --verbosity normal
