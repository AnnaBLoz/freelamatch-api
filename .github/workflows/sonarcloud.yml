name: Analyze .NET Backend

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: .
          sparse-checkout-cone-mode: false

      - name: Debug - List files
        run: |
          echo "=== Raiz do repositório ==="
          ls -la
          echo "=== Conteúdo da pasta FreelaMatchAPI ==="
          ls -la FreelaMatchAPI

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FreelaMatchAPI/FreelaMatchAPI.csproj

      - name: Build
        run: dotnet build FreelaMatchAPI/FreelaMatchAPI.csproj --no-restore -c Release

      - name: Test with coverage
        run: |
          dotnet test FreelaMatchAPI/FreelaMatchAPI.csproj \
            --no-build -c Release \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:CoverletOutput=../coverage.cobertura.xml \
            --logger trx \
            --results-directory ../TestResults

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}