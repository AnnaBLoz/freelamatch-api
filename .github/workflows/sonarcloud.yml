name: .NET 8 CI with SonarCloud

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION_FILE: freela-match-api/freela-match-api.sln
  TEST_PROJECT: freela-match-api-test/freela-match-api-test.csproj
  SONAR_PROJECT_KEY: AnnaBLoz_freelamatch-api
  SONAR_ORG: annabloz

permissions:
  contents: read
  pull-requests: write

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: windows-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: .sonar/scanner
          key: ${{ runner.os }}-sonar-scanner-2025
          restore-keys: ${{ runner.os }}-sonar-scanner-

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -Path .sonar/scanner -ItemType Directory -Force
          dotnet tool update --tool-path .sonar/scanner dotnet-sonarscanner

      - name: SonarCloud Begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin `
            /k:"${{ env.SONAR_PROJECT_KEY }}" `
            /o:"${{ env.SONAR_ORG }}" `
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.projectBaseDir="${{ github.workspace }}" `
            /d:sonar.scanner.metadataFilePath="${{ runner.temp }}/sonar-metadata.json" `
            /d:sonar.sources="freela-match-api" `
            /d:sonar.tests="freela-match-api-test" `
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml" `
            /d:sonar.cs.vstest.reportsPaths="**/*.trx" `
            /d:sonar.exclusions="**/*Program.cs,**/*Migrations/*,**/*.dll,**/*obj/**,**/*bin/**" `
            /d:sonar.verbose=true

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_FILE }} --no-restore --configuration Release

      - name: Run tests + Generate coverage (100% confiável)
        shell: pwsh
        run: |
          dotnet test ${{ env.TEST_PROJECT }} `
            --no-build `
            --logger trx `
            /p:CollectCoverage=true `
            /p:CoverletOutputFormat=opencover `
            /p:CoverletOutput="./coverage.xml" `
            /p:Exclude="[*.Tests]*"

      # Verifica se o arquivo foi gerado na raiz
      - name: Verify coverage.xml exists
        run: |
          if (Test-Path "freela-match-api-test/coverage.xml") {
            Write-Host "Cobertura gerada com sucesso!"
            Copy-Item "freela-match-api-test/coverage.xml" -Destination "coverage.xml"
          } else {
            Write-Error "coverage.xml não foi gerado!"
            Get-ChildItem -Recurse -Include coverage.xml -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Show final coverage file
        run: |
          Get-Content coverage.xml -Head 10

      - name: SonarCloud End
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  # Build rápido (Linux)
  build:
    name: Build & Test (fast)
    needs: sonarcloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore & Build & Test
        run: |
          dotnet restore ${{ env.SOLUTION_FILE }}
          dotnet build ${{ env.SOLUTION_FILE }} --no-restore
          dotnet test ${{ env.TEST_PROJECT }} --no-build