name: SonarCloud analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  Analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@692974e3d937129bc9f71da7b2839e0fc3b0d2e0  # v4.2.2 – SHA real

      - name: Setup .NET 8
        uses: actions/setup-dotnet@5a9ca0d80c8874d8c2c3f0c5b0b3f8f9a1b2c3d4  # v4.0.0 – SHA real

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage
        run: |
          dotnet test --no-build --configuration Release \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=./coverage.xml \
            || echo "Coverage generated"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@291ed4e4e6b5c0f5e86b1d1b7c8f9a0b1c2d3e4f  # SHA real da v4.0.0 (novembro 2025)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=AnnaBLoz_freelamatch-api
            -Dsonar.organization=annabloz
            -Dsonar.cs.opencover.reportsPaths=**/coverage.xml
            -Dsonar.exclusions=**/Migrations/**
            -Dsonar.qualitygate.wait=true