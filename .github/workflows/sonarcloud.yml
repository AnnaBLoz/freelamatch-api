name: Analyze .NET Backend

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build, Test, Coverage & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner --version 5.15.0

      - name: Add .NET global tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run tests and collect coverage
        run: |
          dotnet test \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=$(pwd)/coverage.opencover.xml

      - name: SonarCloud Begin
        run: |
          dotnet sonarscanner begin \
            /k:"AnnaBLoz_freelamatch-api" \
            /o:"annabloz" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.login="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.opencover.reportsPaths="$(pwd)/coverage.opencover.xml" \
            /d:sonar.sources="FreelaMatchAPI" \
            /d:sonar.tests="FreelaMatchAPI.Tests" \
            /d:sonar.test.inclusions="**/*Tests.cs" \
            /d:sonar.exclusions="**/Migrations/**,**/Program.cs"

      - name: Build for SonarCloud analysis
        run: dotnet build --configuration Release

      - name: Run SonarCloud End
        run: dotnet sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}"

      - name: Notify completion
        run: echo "### SonarCloud Analysis Complete" >> $GITHUB_STEP_SUMMARY
