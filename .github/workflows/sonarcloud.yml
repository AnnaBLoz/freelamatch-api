# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by separate terms of service, privacy policy, and support documentation.
# This workflow helps you trigger a SonarCloud analysis of your code and populates
# GitHub Code Scanning alerts with the vulnerabilities found.
# Free for open source project.

name: SonarCloud analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  Analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # AQUI É A PARTE QUE CONSERTA A COBERTURA
      - name: Test with coverage
        run: |
          dotnet test --no-build --configuration Release \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:CoverletOutput=./coverage.cobertura.xml \
            /p:Exclude="[*.Tests]*" \
            || echo "Tests finished – coverage generated anyway"

      # AQUI É A PARTE QUE FAZ O SONARCLOUD ENCONTRAR O ARQUIVO
      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=AnnaBLoz_freelamatch-api
            -Dsonar.organization=annabloz
            -Dsonar.cs.cobertura.reportPaths=**/coverage.cobertura.xml
            -Dsonar.exclusions=**/Migrations/**
            -Dsonar.qualitygate.wait=true