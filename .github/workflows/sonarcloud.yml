name: SonarCloud Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read
  contents: read

jobs:
  Analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Remove conflicting files
        run: rm -f sonar-project.properties

      - name: Install SonarCloud scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore dependencies
        run: dotnet restore

      - name: Begin SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"AnnaBLoz_freelamatch-api" \
            /o:"annabloz" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.opencover.reportsPaths="coverage.opencover.xml,**/coverage.opencover.xml" \
            /d:sonar.exclusions="**/Migrations/**,**/obj/**,**/bin/**" \
            /d:sonar.coverage.exclusions="**/*Tests.cs,**/Program.cs"

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Create coverage directory
        run: mkdir -p ./coverage-reports

      - name: Run tests with coverage (Method 1)
        continue-on-error: true
        run: |
          echo "Método 1: Coverlet com output na raiz"
          
          dotnet test \
            --configuration Release \
            --no-build \
            --verbosity normal \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=../../coverage.opencover.xml

      - name: Run tests with coverage (Method 2)
        if: always()
        continue-on-error: true
        run: |
          echo "Método 2: Coverlet padrão"
          
          dotnet test \
            --configuration Release \
            --no-build \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover

      - name: Run tests with coverage (Method 3 - Collector)
        if: always()
        continue-on-error: true
        run: |
          echo "Método 3: XPlat Code Coverage"
          
          dotnet test \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage-reports \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Find and consolidate coverage files
        if: always()
        run: |
          echo "=== PROCURANDO TODOS OS ARQUIVOS DE COBERTURA ==="
          find . -type f -name "*.xml" | grep -iE "(coverage|opencover)" || echo "Nenhum encontrado"
          
          echo ""
          echo "=== LISTANDO ARQUIVOS ESPECÍFICOS ==="
          find . -name "coverage.opencover.xml" -o -name "*.opencover.xml" | while read file; do
            echo "Encontrado: $file ($(wc -l < "$file") linhas)"
          done
          
          echo ""
          echo "=== CONSOLIDANDO ARQUIVOS NA RAIZ ==="
          
          # Método 1: Copia da pasta de testes
          if [ -f "./FreelaMatch.Tests/coverage.opencover.xml" ]; then
            echo " Copiando de FreelaMatch.Tests/"
            cp ./FreelaMatch.Tests/coverage.opencover.xml ./coverage.opencover.xml
          fi
          
          # Método 2: Procura qualquer coverage.opencover.xml
          COVERAGE_FILE=$(find . -name "coverage.opencover.xml" | head -1)
          if [ -n "$COVERAGE_FILE" ] && [ ! -f "./coverage.opencover.xml" ]; then
            echo " Copiando de $COVERAGE_FILE"
            cp "$COVERAGE_FILE" ./coverage.opencover.xml
          fi
          
          # Método 3: Procura nos resultados do collector
          COLLECTOR_FILE=$(find ./coverage-reports -name "*.xml" -o -name "coverage.cobertura.xml" | head -1)
          if [ -n "$COLLECTOR_FILE" ] && [ ! -f "./coverage.opencover.xml" ]; then
            echo "Copiando de coverage-reports: $COLLECTOR_FILE"
            cp "$COLLECTOR_FILE" ./coverage.opencover.xml
          fi
          
          echo ""
          echo "=== VERIFICAÇÃO FINAL ==="
          if [ -f "./coverage.opencover.xml" ]; then
            echo "coverage.opencover.xml EXISTE NA RAIZ!"
            echo "Tamanho: $(wc -l < ./coverage.opencover.xml) linhas"
            echo ""
            echo "Primeiras 20 linhas:"
            head -20 ./coverage.opencover.xml
          else
            echo "ERRO: coverage.opencover.xml NÃO FOI CRIADO NA RAIZ!"
            echo ""
            echo "Todos os arquivos XML encontrados:"
            find . -name "*.xml" | grep -v obj | grep -v bin | head -20
          fi

      - name: Verify coverage file exists before ending analysis
        if: always()
        run: |
          if [ ! -f "./coverage.opencover.xml" ]; then
            echo "AVISO: Arquivo de cobertura não encontrado!"
            echo "O SonarCloud vai rodar sem dados de cobertura."
            
            # Cria um arquivo vazio para não quebrar
            echo '<?xml version="1.0" encoding="utf-8"?><CoverageSession></CoverageSession>' > ./coverage.opencover.xml
          fi

      - name: End SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Summary Report
        if: always()
        run: |
          echo "### Relatório de Cobertura" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo " [Dashboard SonarCloud](https://sonarcloud.io/dashboard?id=AnnaBLoz_freelamatch-api)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "./coverage.opencover.xml" ]; then
            LINES=$(wc -l < ./coverage.opencover.xml)
            if [ "$LINES" -gt 5 ]; then
              echo "**Arquivo de cobertura gerado com sucesso!**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "- Arquivo: \`coverage.opencover.xml\`" >> $GITHUB_STEP_SUMMARY
              echo "- Tamanho: $LINES linhas" >> $GITHUB_STEP_SUMMARY
              echo "- Status: Enviado ao SonarCloud" >> $GITHUB_STEP_SUMMARY
            else
              echo "**Arquivo de cobertura vazio ou inválido**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "O arquivo existe mas tem apenas $LINES linhas." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo " **Nenhum arquivo de cobertura foi gerado**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Análise do SonarCloud executada sem dados de cobertura." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Testes executados:** 32 " >> $GITHUB_STEP_SUMMARY