name: .NET 8 CI/CD with Coverage & Azure Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AZURE_WEBAPP_NAME: freela-match-api-bgb3cdfgc0hpcrcn
  AZURE_WEBAPP_PACKAGE_PATH: './publish'

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  build-test-coverage:
    name: Build, Test & Coverage Report
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: |
          dotnet restore freela-match-api/freela-match-api.csproj
          dotnet restore freela-match-api-test/freela-match-api-test.csproj

      - name: Build
        run: |
          dotnet build freela-match-api/freela-match-api.csproj --no-restore --configuration Release
          dotnet build freela-match-api-test/freela-match-api-test.csproj --no-restore --configuration Release

      - name: Run tests with coverage
        run: |
          dotnet test freela-match-api-test/freela-match-api-test.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --settings coverlet.runsettings

      - name: Generate Coverage Report
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"./TestResults/**/coverage.opencover.xml" \
            -targetdir:"./CoverageReport" \
            -reporttypes:"Html;Badges;MarkdownSummaryGithub;JsonSummary;Cobertura" \
            -title:"FreelaMatch API - Coverage Report" \
            -verbosity:"Info"

      - name: Extract Coverage Percentage
        id: coverage
        run: |
          COVERAGE=$(grep -oP '(?<=Line coverage: )\d+' ./CoverageReport/Summary.txt | head -1)
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"

      - name: Add coverage to job summary
        run: |
          echo "## Code Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat ./CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Full HTML Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/coverage/)" >> $GITHUB_STEP_SUMMARY

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report
          recreate: true
          message: |
            ## Code Coverage Report
            
            $(cat ./CoverageReport/SummaryGithub.md)
            
            ---
            
            **Coverage: ${{ steps.coverage.outputs.coverage }}%**
            
            [View detailed HTML report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/coverage/)

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./CoverageReport
          retention-days: 30

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./CoverageReport
          destination_dir: coverage
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Coverage Check
        run: |
          COVERAGE=$(grep -oP '(?<=Line coverage: )\d+' ./CoverageReport/Summary.txt | head -1)
          THRESHOLD=50
          
          if [ "$COVERAGE" -lt "$THRESHOLD" ]; then
            echo "Coverage ($COVERAGE%) is below threshold ($THRESHOLD%)"
          else
            echo "Coverage ($COVERAGE%) meets threshold ($THRESHOLD%)"
          fi

      # Publicar aplicação para deploy
      - name: Publish application
        run: |
          # Limpar saída anterior
          rm -rf ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
          
          # Publicar APENAS o projeto principal
          dotnet publish freela-match-api/freela-match-api.csproj \
            --configuration Release \
            --no-build \
            --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }} \
            /p:PublishProfile=DefaultContainer
          
          # Remover arquivos de teste que possam ter sido incluídos
          find ${{ env.AZURE_WEBAPP_PACKAGE_PATH }} -type f \( \
            -name "*Test*" -o \
            -name "*test*" -o \
            -name "xunit*" -o \
            -name "coverlet*" -o \
            -name "testhost*" -o \
            -name "*CodeCoverage*" -o \
            -name "Moq*" -o \
            -name "FluentAssertions*" \
          \) -delete
          
          # Remover diretórios de teste
          find ${{ env.AZURE_WEBAPP_PACKAGE_PATH }} -type d \( \
            -name "CodeCoverage" -o \
            -name "*Test*" \
          \) -exec rm -rf {} + 2>/dev/null || true
          
          echo "Files to deploy:"
          ls -la ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Upload artifact for deployment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-test-coverage
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: 'Production'
      url: https://freela-match-api-bgb3cdfgc0hpcrcn.canadacentral-01.azurewebsites.net
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./deploy

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via FTP
        env:
          FTP_USERNAME: ${{ secrets.AZURE_WEBAPP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.AZURE_WEBAPP_PASSWORD }}
        run: |
          echo "Starting FTP deployment..."
          
          # Criar arquivo app_offline.htm para parar a aplicação durante deploy
          echo '<!DOCTYPE html><html><head><title>App Offline</title></head><body><h1>Application is updating...</h1></body></html>' > app_offline.htm
          
          # Upload app_offline.htm primeiro para parar a aplicação
          lftp -c "
          set ssl:verify-certificate no
          set ftp:use-site-chmod no
          open -u $FTP_USERNAME,$FTP_PASSWORD ftps://waws-prod-yt1-003.ftp.azurewebsites.windows.net
          put -O /site/wwwroot app_offline.htm
          bye
          " || true
          
          echo "Application stopped for deployment"
          sleep 5
          
          # Fazer o deploy
          lftp -c "
          set ssl:verify-certificate no
          set ftp:use-site-chmod no
          open -u $FTP_USERNAME,$FTP_PASSWORD ftps://waws-prod-yt1-003.ftp.azurewebsites.windows.net
          mirror --reverse --delete --verbose --only-newer ./deploy /site/wwwroot
          bye
          " || true
          
          # Remover app_offline.htm para iniciar a aplicação
          lftp -c "
          set ssl:verify-certificate no
          open -u $FTP_USERNAME,$FTP_PASSWORD ftps://waws-prod-yt1-003.ftp.azurewebsites.windows.net
          rm /site/wwwroot/app_offline.htm
          bye
          " || true
          
          echo "Files uploaded successfully!"

      - name: Verify deployment
        run: |
          echo "Waiting for application to restart..."
          sleep 30
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://freela-match-api-bgb3cdfgc0hpcrcn.canadacentral-01.azurewebsites.net)
          echo "Application response code: $RESPONSE"
          
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 404 ]; then
            echo "Application is responding!"
            echo "Check Swagger at: https://freela-match-api-bgb3cdfgc0hpcrcn.canadacentral-01.azurewebsites.net/swagger"
          else
            echo "Application returned status code: $RESPONSE"
          fi