name: Analyze .NET Backend

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-analyze:
    name: Build, Test and SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install ReportGenerator (optional, for HTML coverage)
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      # --- SonarCloud Begin ---
      - name: SonarCloud Begin
        run: |
          dotnet sonarscanner begin \
            /k:"AnnaBLoz_freelamatch-api" \
            /o:"annabloz" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.login="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.opencover.reportsPaths="$(pwd)/coverage.opencover.xml" \
            /d:sonar.sources="FreelaMatchAPI" \
            /d:sonar.tests="FreelaMatchAPI.Tests" \
            /d:sonar.test.inclusions="**/*Tests.cs" \
            /d:sonar.exclusions="**/Migrations/**,**/Program.cs"
      
      # --- Run Tests and Collect Coverage ---
      - name: Run Tests with Coverage
        run: |
          for proj in $(find ./tests -name "*.csproj"); do
            dotnet test $proj \
              --configuration Release \
              --no-build \
              /p:CollectCoverage=true \
              /p:CoverletOutputFormat=opencover \
              /p:CoverletOutput=$(pwd)/coverage.opencover.xml
          done

      # --- SonarCloud End ---
      - name: SonarCloud End
        run: |
          dotnet sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}"
