name: Analyze .NET Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Add tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Restore
        run: dotnet restore

      - name: Sonar Begin
        run: |
          dotnet sonarscanner begin \
            /k:"AnnaBLoz_freelamatch-api" \
            /o:"annabloz" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.login="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs,**/*Tests.csproj"

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test + Coverage (FUNCIONA 100%)
        run: |
          dotnet test FreelaMatch.Tests/FreelaMatch.Tests.csproj \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings

      - name: Debug - Mostra onde o coverage foi gerado
        run: |
          echo "=== Coverage files generated ==="
          find . -name "coverage.opencover.xml" -type f || echo "Not found yet"
          find . -path "*/TestResults/*" -name "coverage.opencover.xml" -exec echo "Found: {}" \;

      - name: Sonar End
        run: dotnet sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}"