name: Analyze .NET Backend

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Este checkout especial mata o bug do clone vazio
      - name: Checkout repository (full clone)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.ref }}
          clean: true
          filter: tree:0   # esta linha é a mágica

      - name: Debug – mostrar que agora veio tudo
        run: |
          echo "=== Raiz do repositório ==="
          ls -la
          echo ""
          echo "=== Conteúdo da pasta FreelaMatchAPI ==="
          ls -la FreelaMatchAPI | head -20

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore & Build & Test
        run: |
          dotnet restore FreelaMatchAPI/FreelaMatchAPI.csproj
          dotnet build FreelaMatchAPI/FreelaMatchAPI.csproj -c Release --no-restore
          dotnet test FreelaMatchAPI/FreelaMatchAPI.csproj \
            --no-build -c Release \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:CoverletOutput=../coverage.cobertura.xml \
            --logger trx \
            --results-directory ../TestResults

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=AnnaBLoz_freelamatch-api
            -Dsonar.organization=annabloz
            -Dsonar.cs.vstest.reportsPaths=**/TestResults/*.trx
            -Dsonar.cs.opencover.reportsPaths=coverage.cobertura.xml
            -Dsonar.qualitygate.wait=true