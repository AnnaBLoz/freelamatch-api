name: SonarCloud Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run tests with coverage (runsettings)
        run: |
          dotnet test ./freela-match-api-test/freela-match-api-test.csproj \
            --settings ./freela-match-api-test/coverlet.runsettings \
            --logger "trx;LogFileName=test_results.trx"

          echo "Procurando arquivo de cobertura..."
          find freela-match-api-test/TestResults -name "coverage.cobertura.xml"

          COVERAGE_FILE=$(find freela-match-api-test/TestResults -name "coverage.cobertura.xml" | sort | tail -n 1)
          echo "COVERAGE_FILE=$COVERAGE_FILE" >> $GITHUB_ENV
          echo "Arquivo selecionado: $COVERAGE_FILE"

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@v2.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=AnnaBLoz_freelamatch-api
            -Dsonar.organization=annabloz
            -Dsonar.sources=freela-match-api
            -Dsonar.tests=freela-match-api-test
            -Dsonar.test.inclusions=freela-match-api-test/**/*.cs
            -Dsonar.exclusions=freela-match-api-test/**/bin/**,freela-match-api-test/**/obj/**
            -Dsonar.cs.cobertura.reportsPaths="${{ env.COVERAGE_FILE }}"
            -Dsonar.verbose=true
          projectBaseDir: .
