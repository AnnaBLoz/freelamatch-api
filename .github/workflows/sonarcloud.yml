name: SonarCloud Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read
  contents: read

jobs:
  Analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # importante para o SonarCloud detectar corretamente as mudanças

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage (OpenCover)
        run: |
          dotnet test ./FreelaMatch.Tests/FreelaMatch.Tests.csproj \
            --no-build \
            --configuration Release \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=TestResults/ \
            /p:MergeWith=TestResults/coverage.json \
            /p:Include="[FreelaMatch.*]*" \
            /p:Exclude="[*]FreelaMatch.Migrations.*"

      - name: Verify coverage file was generated
        run: |
          echo "=== Conteúdo do diretório TestResults ==="
          ls -la TestResults/
          echo "=== Primeiras linhas do coverage.opencover.xml ==="
          head -30 TestResults/coverage.opencover.xml || echo "Arquivo não encontrado!"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=AnnaBLoz_freelamatch-api
            -Dsonar.organization=annabloz
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.cs.opencover.reportsPaths=TestResults/coverage.opencover.xml
            -Dsonar.exclusions=**/Migrations/**
            -Dsonar.qualitygate.wait=true