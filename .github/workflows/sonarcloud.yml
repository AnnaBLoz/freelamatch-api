name: .NET 8 CI/CD with Coverage & Azure Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AZURE_WEBAPP_NAME: freela-match-api-bgb3cdfgc0hpcrcn
  AZURE_WEBAPP_PACKAGE_PATH: './publish'

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  build-test-coverage:
    name: Build, Test & Coverage Report
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: |
          dotnet restore freela-match-api/freela-match-api.csproj
          dotnet restore freela-match-api-test/freela-match-api-test.csproj

      - name: Build
        run: |
          dotnet build freela-match-api/freela-match-api.csproj --no-restore --configuration Release
          dotnet build freela-match-api-test/freela-match-api-test.csproj --no-restore --configuration Release

      - name: Run tests with coverage
        run: |
          dotnet test freela-match-api-test/freela-match-api-test.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --settings coverlet.runsettings

      - name: Generate Coverage Report
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"./TestResults/**/coverage.opencover.xml" \
            -targetdir:"./CoverageReport" \
            -reporttypes:"Html;Badges;MarkdownSummaryGithub;JsonSummary;Cobertura" \
            -title:"FreelaMatch API - Coverage Report" \
            -verbosity:"Info"

      - name: Extract Coverage Percentage
        id: coverage
        run: |
          COVERAGE=$(grep -oP '(?<=Line coverage: )\d+' ./CoverageReport/Summary.txt | head -1)
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE%"

      - name: Add coverage to job summary
        run: |
          echo "## Code Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat ./CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Full HTML Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/coverage/)" >> $GITHUB_STEP_SUMMARY

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report
          recreate: true
          message: |
            ## Code Coverage Report
            
            $(cat ./CoverageReport/SummaryGithub.md)
            
            ---
            
            **Coverage: ${{ steps.coverage.outputs.coverage }}%**
            
            [View detailed HTML report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/coverage/)

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./CoverageReport
          retention-days: 30

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./CoverageReport
          destination_dir: coverage
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Coverage Check
        run: |
          COVERAGE=$(grep -oP '(?<=Line coverage: )\d+' ./CoverageReport/Summary.txt | head -1)
          THRESHOLD=50
          
          if [ "$COVERAGE" -lt "$THRESHOLD" ]; then
            echo "Coverage ($COVERAGE%) is below threshold ($THRESHOLD%)"
          else
            echo "Coverage ($COVERAGE%) meets threshold ($THRESHOLD%)"
          fi

      # Publicar aplicação para deploy
      - name: Publish application
        run: |
          dotnet publish freela-match-api/freela-match-api.csproj \
            --configuration Release \
            --no-build \
            --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Upload artifact for deployment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-test-coverage
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: 'Production'
      url: https://freela-match-api-bgb3cdfgc0hpcrcn.canadacentral-01.azurewebsites.net
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./deploy

      - name: Create ZIP package
        run: |
          cd ./deploy
          zip -r ../app.zip .
          cd ..
          echo "Package size: $(du -h app.zip | cut -f1)"

      - name: Deploy to Azure App Service
        run: |
          echo "Starting deployment..."
          
          # Tentar com o username exatamente como está
          echo "Attempting deployment (attempt 1/2)..."
          STATUS_CODE=$(curl -X POST \
            "https://freela-match-api-bgb3cdfgc0hpcrcn.scm.canadacentral-01.azurewebsites.net/api/zipdeploy" \
            -u "${{ secrets.AZURE_WEBAPP_USERNAME }}:${{ secrets.AZURE_WEBAPP_PASSWORD }}" \
            -H "Content-Type: application/zip" \
            --data-binary @app.zip \
            --write-out "%{http_code}" \
            --silent \
            --output /dev/null \
            --max-time 600)
          
          echo "Attempt 1 status code: $STATUS_CODE"
          
          # Se falhou, tentar com $ no início
          if [ "$STATUS_CODE" -eq 401 ]; then
            echo "Attempting deployment with \$ prefix (attempt 2/2)..."
            STATUS_CODE=$(curl -X POST \
              "https://freela-match-api-bgb3cdfgc0hpcrcn.scm.canadacentral-01.azurewebsites.net/api/zipdeploy" \
              -u "\${{ secrets.AZURE_WEBAPP_USERNAME }}:${{ secrets.AZURE_WEBAPP_PASSWORD }}" \
              -H "Content-Type: application/zip" \
              --data-binary @app.zip \
              --write-out "%{http_code}" \
              --silent \
              --output /dev/null \
              --max-time 600)
            
            echo "Attempt 2 status code: $STATUS_CODE"
          fi
          
          if [ "$STATUS_CODE" -eq 200 ] || [ "$STATUS_CODE" -eq 202 ]; then
            echo "Deploy successful!"
          else
            echo "Deploy failed with status code: $STATUS_CODE"
            echo ""
            echo "Please verify your credentials:"
            echo "1. Go to Azure Portal > App Service > Deployment Center"
            echo "2. Click on 'FTPS credentials' or 'Local Git/FTPS credentials'"
            echo "3. Copy the EXACT username (including any $ or \\ characters)"
            echo "4. Update the AZURE_WEBAPP_USERNAME secret in GitHub"
            exit 1
          fi

      - name: Verify deployment
        run: |
          echo "Waiting for application to start..."
          sleep 45
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://freela-match-api-bgb3cdfgc0hpcrcn.canadacentral-01.azurewebsites.net)
          echo "Application response code: $RESPONSE"
          
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 404 ]; then
            echo "Application is responding!"
            echo "Check Swagger at: https://freela-match-api-bgb3cdfgc0hpcrcn.canadacentral-01.azurewebsites.net/swagger"
          else
            echo "Application returned status code: $RESPONSE"
            echo "Check Azure Portal logs for details"
          fi