name: .NET 8 CI with SonarCloud

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION_FILE: freela-match-api/freela-match-api.sln
  TEST_PROJECT: freela-match-api-test/freela-match-api-test.csproj
  SONAR_PROJECT_KEY: AnnaBLoz_freelamatch-api
  SONAR_ORG: annabloz

permissions:
  pull-requests: write
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: windows-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: .sonar/scanner
          key: ${{ runner.os }}-sonar-scanner-${{ hashFiles('**/global.json', '**/nuget.config') }}
          restore-keys: ${{ runner.os }}-sonar-scanner-

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -Path .sonar/scanner -ItemType Directory -Force
          dotnet tool update --tool-path .sonar/scanner dotnet-sonarscanner

      - name: Install dotnet-coverage tool
        run: dotnet tool install --global dotnet-coverage

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # ===== INÍCIO DA ANÁLISE SONARCLOUD =====
      - name: SonarCloud Begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin `
            /k:"${{ env.SONAR_PROJECT_KEY }}" `
            /o:"${{ env.SONAR_ORG }}" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml" `
            /d:sonar.exclusions="**/*.dll,**/Migrations/**,**/Program.cs,**/obj/**,**/bin/**" `
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs" `
            /d:sonar.verbose=true

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_FILE }} --no-restore --configuration Release

      # ===== TESTES + COBERTURA =====
      - name: Run tests with coverage
        shell: pwsh
        run: |
          # Usar coverlet com arquivo de configuração
          dotnet test ${{ env.SOLUTION_FILE }} `
            --no-build `
            --configuration Release `
            --logger trx `
            --collect:"XPlat Code Coverage" `
            --results-directory TestResults/ `
            --settings freela-match-api-test/coverlet.runsettings

      - name: Convert coverage to SonarCloud format
        shell: pwsh
        run: |
          Write-Host "=== Searching for coverage files ==="
          $coverageFiles = Get-ChildItem -Path TestResults -Recurse -Filter "coverage.cobertura.xml"
          
          Write-Host "Found $($coverageFiles.Count) coverage file(s)"
          $coverageFiles | ForEach-Object { Write-Host "  - $($_.FullName)" }
          
          if ($coverageFiles.Count -eq 0) {
            Write-Host "ERROR: No coverage files found!"
            Get-ChildItem -Path TestResults -Recurse | Format-Table Name, FullName
            exit 1
          }
          
          # Converter para formato Visual Studio XML
          Write-Host ""
          Write-Host "=== Converting to VS XML format ==="
          if ($coverageFiles.Count -eq 1) {
            dotnet-coverage merge $coverageFiles[0].FullName -f xml -o coverage.xml
          } else {
            # Se houver múltiplos arquivos, fazer merge de todos
            $paths = $coverageFiles | ForEach-Object { $_.FullName }
            dotnet-coverage merge ($paths -join ',') -f xml -o coverage.xml
          }
          
          if (Test-Path "coverage.xml") {
            Write-Host "coverage.xml created successfully"
            Write-Host "  Size: $((Get-Item coverage.xml).Length) bytes"
          } else {
            Write-Host "ERROR: Failed to create coverage.xml"
            exit 1
          }

      - name: Verify and debug coverage file
        shell: pwsh
        run: |
          Write-Host "=== Coverage File Check ==="
          if (Test-Path "coverage.xml") {
            Write-Host "Coverage file found"
            $fileInfo = Get-Item "coverage.xml"
            Write-Host "  Path: $($fileInfo.FullName)"
            Write-Host "  Size: $($fileInfo.Length) bytes"
            Write-Host ""
            Write-Host "=== First 20 lines of coverage.xml ==="
            Get-Content "coverage.xml" -Head 20
            Write-Host ""
            Write-Host "=== Checking for source file references ==="
            $content = Get-Content "coverage.xml" -Raw
            if ($content -match 'source') {
              Write-Host "Found source references in coverage file"
            } else {
              Write-Host "No source references found - this might be the problem!"
            }
          } else {
            Write-Host "Coverage file NOT found!"
            Write-Host "Current directory: $(Get-Location)"
            Write-Host "Searching for any coverage files..."
            Get-ChildItem -Recurse -Filter "*coverage*" | Select-Object FullName, Length
            exit 1
          }

      # ===== FIM DA ANÁLISE SONARCLOUD =====
      - name: SonarCloud End
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

      - name: Upload coverage as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 5

  # Job opcional: build e testes rápidos sem Sonar
  build:
    name: Build & Test (fast)
    needs: sonarcloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --no-restore --configuration Release

      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT }} --no-build --configuration Release --verbosity normal