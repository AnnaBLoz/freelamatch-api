name: Analyze .NET Backend

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build, Test, Coverage & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Add .NET global tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Restore dependencies
        run: dotnet restore

      - name: SonarCloud Begin
        run: |
          dotnet sonarscanner begin \
            /k:"AnnaBLoz_freelamatch-api" \
            /o:"annabloz" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.login="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs" \
            /d:sonar.test.inclusions="**/*Tests.cs" \
            /d:sonar.cs.opencover.reportsPaths="$(pwd)/FreelaMatch.Tests/coverage/coverage.opencover.xml"

      - name: Build
        run: dotnet build --configuration Release --no-incremental

      - name: Run tests and collect coverage
        run: |
          dotnet test FreelaMatch.Tests/FreelaMatch.Tests.csproj \
            --configuration Release \
            --no-build \
            /p:CollectCoverage=true \
            /p:CoverletOutput=$(pwd)/FreelaMatch.Tests/coverage/ \
            /p:CoverletOutputFormat=opencover \
            /p:Exclude="[xunit.*]*"

      - name: Verify coverage file
        run: |
          echo "Looking for coverage report..."
          find FreelaMatch.Tests/coverage -type f
          echo "Preview of coverage.opencover.xml:"
          head -n 20 FreelaMatch.Tests/coverage/coverage.opencover.xml || echo "File not found!"

      - name: SonarCloud End
        run: dotnet sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}"
