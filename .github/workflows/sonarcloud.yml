name: SonarCloud Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read
  contents: read

jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install global tools
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global coverlet.console
          
      - name: Restore dependencies
        run: dotnet restore
        
      - name: Begin SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"AnnaBLoz_freelamatch-api" \
            /o:"annabloz" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.exclusions="**/Migrations/**" \
            /d:sonar.coverage.exclusions="**/*Tests.cs,**/Program.cs,**/Migrations/**" \
            /d:sonar.cs.opencover.reportsPaths=coverage.opencover.xml
          
      - name: Build
        run: dotnet build --configuration Release --no-restore
        
      - name: Run tests with coverage
        run: |
          # Localiza todos os projetos de teste e gera cobertura OpenCover
          for proj in $(find ./tests -name "*.csproj"); do
            coverlet $(dirname $proj)/bin/Release/net8.0/$(basename $proj .csproj).dll \
              --target "dotnet" \
              --targetargs "test $proj --no-build --configuration Release" \
              --format opencover \
              --output coverage.opencover.xml
          done
          
      - name: Verify coverage file
        run: |
          if [ -f "coverage.opencover.xml" ]; then
            echo "Coverage file generated!"
            ls -lh coverage.opencover.xml
            head -10 coverage.opencover.xml
          else
            echo "Coverage file NOT found"
            exit 1
          fi
          
      - name: End SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
        
      - name: Summary
        if: always()
        run: |
          echo "### SonarCloud Analysis Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Dashboard](https://sonarcloud.io/dashboard?id=AnnaBLoz_freelamatch-api)" >> $GITHUB_STEP_SUMMARY
