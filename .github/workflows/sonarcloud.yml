name: SonarCloud - Backend

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: Analyze .NET Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        working-directory: ./freela-match-api
        run: dotnet restore

      - name: Build API
        working-directory: ./freela-match-api
        run: dotnet build --configuration Release --no-restore

      - name: Run tests with coverage
        working-directory: ./freela-match-api
        run: |
          dotnet test \
            --configuration Release \
            --collect:"XPlat Code Coverage"

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=annabloz
            -Dsonar.projectKey=AnnaBLoz_freelamatch-api
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
            -Dsonar.cs.vstest.reportsPaths=**/TestResults/**/*.trx
            -Dsonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.cobertura.xml
            -Dsonar.exclusions=**/Migrations/**

      - name: SonarCloud Quality Gate
        uses: SonarSource/sonarcloud-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
