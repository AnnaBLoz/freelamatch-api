name: SonarCloud Analysis
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read
  contents: read

jobs:
  Analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Java (required by SonarScanner)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean conflicting Sonar files
        run: rm -f sonar-project.properties

      # Instalar ferramentas necessárias
      - name: Install tools
        run: |
          dotnet tool install --global dotnet-sonarscanner

      # IMPORTANTE: Restaurar ANTES do build e do SonarScanner
      - name: Restore dependencies
        run: |
          dotnet restore
          dotnet restore ./FreelaMatch.Tests/FreelaMatch.Tests.csproj

      # Build ANTES do SonarScanner para garantir que todas as referências estejam resolvidas
      - name: Build (without SonarScanner)
        run: dotnet build --configuration Release --no-restore

      - name: Begin SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"AnnaBLoz_freelamatch-api" \
            /o:"annabloz" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/coverage.opencover.xml" \
            /d:sonar.exclusions="**/Migrations/**" \
            /d:sonar.coverage.exclusions="**/*Tests.cs,**/Program.cs,**/Migrations/**"

      # Rebuild com o SonarScanner ativo
      - name: Build with SonarScanner
        run: dotnet build --configuration Release --no-restore

      # Testes + Coverage usando Coverlet
      - name: Run tests and generate coverage
        run: |
          dotnet test \
            --configuration Release \
            --no-restore \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=./TestResults/coverage.opencover.xml

      - name: Verify coverage file
        run: |
          if [ -f "./TestResults/coverage.opencover.xml" ]; then
            echo "Coverage file generated"
            ls -lh ./TestResults/coverage.opencover.xml
            echo "Lines: $(wc -l < ./TestResults/coverage.opencover.xml)"
          else
            echo "Coverage file not found"
            ls -la ./TestResults || echo "TestResults folder not found"
            exit 1
          fi

      # End Analysis
      - name: End SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Summary
        if: always()
        run: |
          echo "### SonarCloud Analysis Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Dashboard](https://sonarcloud.io/dashboard?id=AnnaBLoz_freelamatch-api)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tests:** Completed" >> $GITHUB_STEP_SUMMARY
          if [ -f "coverage.xml" ]; then
            SIZE=$(wc -l < coverage.xml)
            echo "**Coverage:** Generated ($SIZE lines)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Coverage:** Failed to generate" >> $GITHUB_STEP_SUMMARY
          fi