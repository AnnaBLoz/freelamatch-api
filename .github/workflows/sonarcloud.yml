name: SonarCloud Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run tests with coverage (runsettings)
        run: |
          dotnet test ./freela-match-api-test/freela-match-api-test.csproj \
            --settings ./freela-match-api-test/coverlet.runsettings

          echo "Procurando arquivo de cobertura..."
          find . -type f -name "coverage.cobertura.xml"

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@v2.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey="AnnaBLoz_freelamatch-api"
            -Dsonar.organization="annabloz"
            -Dsonar.sources=freela-match-api
            -Dsonar.tests=freela-match-api-test
            -Dsonar.test.inclusions=**/*.cs
            -Dsonar.exclusions=**/*.dll
            -Dsonar.cs.cobertura.reportsPaths=**/TestResults/**/coverage.cobertura.xml
            -Dsonar.verbose=true
          projectBaseDir: .
