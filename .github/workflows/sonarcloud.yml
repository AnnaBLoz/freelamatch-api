name: SonarCloud Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: dotnet restore

      - name: Run tests with coverage
        run: |
          mkdir -p coverage
          dotnet test ./FreelaMatch.Tests/FreelaMatch.Tests.csproj \
            --collect:"XPlat Code Coverage" \
            --settings ./FreelaMatch.Tests/coverlet.runsettings \
            --results-directory coverage-temp

          cp $(find coverage-temp -name "coverage.cobertura.xml") coverage/coverage.cobertura.xml

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@v2.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey="SeuProjetoKey"
            -Dsonar.organization="SuaOrg"
            -Dsonar.cs.opencover.reportsPaths="coverage/coverage.cobertura.xml"
            -Dsonar.verbose=true
          projectBaseDir: .
