name: .NET 8 CI with SonarCloud

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Caminhos corrigidos baseados na estrutura real
  SOLUTION_FILE: freela-match-api/freela-match-api.sln
  SONAR_PROJECT_KEY: AnnaBLoz_freelamatch-api
  SONAR_ORG: annabloz

permissions:
  pull-requests: write
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: windows-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug - Show repository structure
        shell: pwsh
        run: |
          Write-Host "=== Repository Root Contents ==="
          Get-ChildItem -Force | Select-Object Name, Mode
          Write-Host ""
          Write-Host "=== Looking for solution files ==="
          Get-ChildItem -Recurse -Filter "*.sln" | Select-Object FullName
          Write-Host ""
          Write-Host "=== Looking for test projects ==="
          Get-ChildItem -Recurse -Filter "*test*.csproj" | Select-Object FullName

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: .sonar/scanner
          key: ${{ runner.os }}-sonar-scanner-${{ hashFiles('**/global.json', '**/nuget.config') }}
          restore-keys: ${{ runner.os }}-sonar-scanner-

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -Path .sonar/scanner -ItemType Directory -Force
          dotnet tool update --tool-path .sonar/scanner dotnet-sonarscanner

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      # ===== INÍCIO DA ANÁLISE SONARCLOUD =====
      - name: SonarCloud Begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin `
            /k:"${{ env.SONAR_PROJECT_KEY }}" `
            /o:"${{ env.SONAR_ORG }}" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.cs.opencover.reportsPaths="coverage.opencover.xml" `
            /d:sonar.cs.cobertura.reportsPaths="coverage.cobertura.xml" `
            /d:sonar.exclusions="**/Migrations/**,**/Program.cs,**/obj/**,**/bin/**" `
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs" `
            /d:sonar.verbose=true

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_FILE }} --no-restore --configuration Release

      # ===== TESTES COM COBERTURA =====
      - name: Run tests with coverage
        shell: pwsh
        run: |
          Write-Host "=== Running tests with coverage ==="
          
          # Limpar TestResults antigos
          if (Test-Path "TestResults") {
            Remove-Item -Recurse -Force "TestResults"
          }
          
          # Executar testes com cobertura - usando a solution para rodar todos os testes
          dotnet test "${{ env.SOLUTION_FILE }}" `
            --no-build `
            --configuration Release `
            --collect:"XPlat Code Coverage" `
            --results-directory TestResults/ `
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          
          Write-Host ""
          Write-Host "=== Test execution completed ==="
          Write-Host "=== Listing TestResults folder ==="
          if (Test-Path "TestResults") {
            Get-ChildItem -Path TestResults -Recurse | Select-Object FullName, Length
          }

      - name: Find and copy coverage file
        shell: pwsh
        run: |
          Write-Host "=== Processing coverage files ==="
          Write-Host "Current directory: $(Get-Location)"
          
          # Procurar por arquivos OpenCover
          $openCoverFiles = Get-ChildItem -Path TestResults -Recurse -Filter "coverage.opencover.xml" -ErrorAction SilentlyContinue
          
          if ($openCoverFiles.Count -eq 0) {
            Write-Host "No OpenCover files found. Looking for Cobertura..."
            $coberturaFiles = Get-ChildItem -Path TestResults -Recurse -Filter "coverage.cobertura.xml" -ErrorAction SilentlyContinue
            
            if ($coberturaFiles.Count -gt 0) {
              Write-Host "Found $($coberturaFiles.Count) Cobertura file(s):"
              $coberturaFiles | ForEach-Object {
                Write-Host "  - $($_.FullName): $($_.Length) bytes"
              }
              
              # Filtrar arquivos muito pequenos (vazios)
              $validFiles = $coberturaFiles | Where-Object { $_.Length -gt 1000 }
              
              if ($validFiles.Count -eq 0) {
                Write-Host "ERROR: All Cobertura files are too small (empty)!"
                Write-Host "File contents:"
                $coberturaFiles | ForEach-Object {
                  Write-Host "`nFile: $($_.FullName)"
                  Get-Content $_.FullName
                }
                exit 1
              }
              
              # Pegar o maior arquivo válido
              $largestFile = $validFiles | Sort-Object Length -Descending | Select-Object -First 1
              Write-Host "`nUsing largest file: $($largestFile.FullName) ($($largestFile.Length) bytes)"
              
              # Copiar para a raiz
              Copy-Item $largestFile.FullName -Destination "coverage.cobertura.xml"
              Write-Host "Copied to: $(Resolve-Path 'coverage.cobertura.xml')"
              
              # Verificar conteúdo
              [xml]$xml = Get-Content "coverage.cobertura.xml"
              $packageCount = $xml.coverage.packages.package.Count
              Write-Host "Packages in coverage: $packageCount"
              
              if ($packageCount -eq 0) {
                Write-Host "ERROR: Coverage file has no packages!"
                exit 1
              }
              
              Write-Host "Coverage file ready for SonarCloud (Cobertura format)!"
              exit 0
            }
            
            Write-Host "ERROR: No coverage files found!"
            Write-Host "Contents of TestResults:"
            Get-ChildItem -Path TestResults -Recurse | Select-Object FullName
            exit 1
          }
          
          # Se chegou aqui, encontrou OpenCover
          Write-Host "Found $($openCoverFiles.Count) OpenCover file(s):"
          $openCoverFiles | ForEach-Object {
            Write-Host "  - $($_.FullName): $($_.Length) bytes"
          }
          
          # Filtrar válidos
          $validFiles = $openCoverFiles | Where-Object { $_.Length -gt 1000 }
          
          if ($validFiles.Count -eq 0) {
            Write-Host "ERROR: All OpenCover files are too small!"
            exit 1
          }
          
          $largestFile = $validFiles | Sort-Object Length -Descending | Select-Object -First 1
          Write-Host "`nUsing: $($largestFile.FullName) ($($largestFile.Length) bytes)"
          
          Copy-Item $largestFile.FullName -Destination "coverage.opencover.xml"
          
          $content = Get-Content "coverage.opencover.xml" -Raw
          $moduleCount = ([regex]::Matches($content, '<Module ')).Count
          $methodCount = ([regex]::Matches($content, '<Method ')).Count
          
          Write-Host "`nCoverage Statistics:"
          Write-Host "  - Modules: $moduleCount"
          Write-Host "  - Methods: $methodCount"
          
          if ($methodCount -eq 0) {
            Write-Host "ERROR: No methods in coverage!"
            exit 1
          }
          
          Write-Host "`nCoverage file copied to: $(Resolve-Path 'coverage.opencover.xml')"
          Write-Host "File size: $((Get-Item 'coverage.opencover.xml').Length) bytes"
          Write-Host "Coverage file ready for SonarCloud (OpenCover format)!"
      
      - name: Verify coverage file before SonarCloud End
        shell: pwsh
        run: |
          Write-Host "=== Final verification before SonarCloud End ==="
          Write-Host "Current directory: $(Get-Location)"
          
          if (Test-Path "coverage.opencover.xml") {
            Write-Host "SUCCESS: coverage.opencover.xml exists"
            Write-Host "  Full path: $(Resolve-Path 'coverage.opencover.xml')"
            Write-Host "  Size: $((Get-Item 'coverage.opencover.xml').Length) bytes"
            
            Write-Host "`nFirst 50 lines of the file:"
            Get-Content "coverage.opencover.xml" -Head 50
          } else {
            Write-Host "ERROR: coverage.opencover.xml NOT FOUND!"
            Write-Host "Files in current directory:"
            Get-ChildItem | Select-Object Name, Length
            exit 1
          }

      # ===== FIM DA ANÁLISE SONARCLOUD =====
      - name: SonarCloud End
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

      - name: Upload coverage as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.*.xml
            TestResults/**/*.xml
          retention-days: 5

  build:
    name: Build & Test (fast)
    needs: sonarcloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --no-restore --configuration Release

      - name: Test
        run: dotnet test ${{ env.SOLUTION_FILE }} --no-build --configuration Release --verbosity normal