name: SonarCloud Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run tests with coverage
        run: |
          # Cria pasta de saída fixa
          mkdir -p ./freela-match-api-test/coverage

          # Roda testes com coverlet direto e saída fixa
          dotnet test ./freela-match-api-test/freela-match-api-test.csproj \
            /p:CollectCoverage=true \
            /p:CoverletOutput=./freela-match-api-test/coverage/coverage.opencover.xml \
            /p:CoverletOutputFormat=opencover \
            --settings coverlet.runsettings

          # Confirma que o arquivo foi criado
          if [ ! -f ./freela-match-api-test/coverage/coverage.opencover.xml ]; then
            echo "Arquivo de cobertura não encontrado!"
            exit 1
          fi

          echo "Arquivo de cobertura gerado:"
          ls -l ./freela-match-api-test/coverage

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@v2.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey="AnnaBLoz_freelamatch-api"
            -Dsonar.organization="annabloz"
            -Dsonar.sources=.
            -Dsonar.cs.opencover.reportsPaths=freela-match-api-test/coverage/coverage.opencover.xml
            -Dsonar.verbose=true
          projectBaseDir: .
