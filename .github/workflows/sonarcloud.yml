name: Analyze .NET Backend

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug – estrutura real (VOCÊ VAI VER A PASTA freelamatch-api AQUI)
        run: |
          pwd
          echo "=== Conteúdo da pasta atual ==="
          ls -la
          echo "=== Se existe a pasta com nome do repo ==="
          ls -la freelamatch-api || echo "não tem pasta freelamatch-api"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore + Build + Test
        run: |
          dotnet restore freelamatch-api/FreelaMatchAPI/FreelaMatchAPI.csproj
          dotnet build freelamatch-api/FreelaMatchAPI/FreelaMatchAPI.csproj -c Release --no-restore
          dotnet test freelamatch-api/FreelaMatchAPI/FreelaMatchAPI.csproj \
            --no-build -c Release \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:CoverletOutput=coverage.cobertura.xml \
            --logger trx \
            --results-directory ./TestResults

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}