name: Analyze .NET Backend

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.303'

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Add .NET global tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Restore
        run: dotnet restore

      - name: SonarCloud Begin
        run: |
          dotnet sonarscanner begin \
            /k:"AnnaBLoz_freelamatch-api" \
            /o:"annabloz" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.login="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.vscoveragexml.reportsPaths="$(pwd)/coverage.xml" \
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs" \
            /d:sonar.test.inclusions="**/*Tests.cs"

      - name: Build
        run: dotnet build --configuration Release --no-incremental

      - name: Install coverage dependencies
        run: sudo apt-get update && sudo apt-get install -y libxml2

      - name: Collect coverage with dotnet-coverage
        run: |
          dotnet tool install --global dotnet-coverage
          dotnet-coverage collect "dotnet test FreelaMatch.Tests/FreelaMatch.Tests.csproj --no-build --configuration Release" \
            -f xml \
            -o "$(pwd)/coverage.xml"

      - name: Verify coverage file
        run: |
          ls -la $(pwd)/coverage.xml
          head -n 20 $(pwd)/coverage.xml || echo "File not found!"

      - name: SonarCloud End
        run: dotnet sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}"
