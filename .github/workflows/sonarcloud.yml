name: Analyze .NET Backend

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build, Test, Coverage & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Add .NET global tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Restore dependencies
        run: dotnet restore

      - name: SonarCloud Begin
        run: |
          dotnet sonarscanner begin \
            /k:"AnnaBLoz_freelamatch-api" \
            /o:"annabloz" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.login="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs" \
            /d:sonar.test.inclusions="**/*Tests.cs" \
            /d:sonar.cs.vscoveragexml.reportsPaths="$(pwd)/coverage.xml"

      - name: Build
        run: dotnet build --configuration Release --no-incremental

      - name: Install dotnet-coverage tool
        run: dotnet tool install --global dotnet-coverage

      - name: Run tests and collect coverage
        run: |
          dotnet-coverage collect "dotnet test FreelaMatch.Tests/FreelaMatch.Tests.csproj --no-build --configuration Release" \
            -f xml \
            -o "$(pwd)/coverage.xml"

      - name: Verify coverage report
        run: |
          echo "Coverage file generated at:"
          ls -la $(pwd)/coverage.xml
          echo "Preview:"
          head -n 20 $(pwd)/coverage.xml

      - name: SonarCloud End
        run: dotnet sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}"
