name: .NET 8 CI with SonarCloud

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION_FILE: freela-match-api/freela-match-api.sln
  TEST_PROJECT: freela-match-api-test/freela-match-api-test.csproj
  SONAR_PROJECT_KEY: AnnaBLoz_freelamatch-api
  SONAR_ORG: annabloz

permissions:
  contents: read
  pull-requests: write

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: windows-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: .sonar/scanner
          key: ${{ runner.os }}-sonar-scanner-2025
          restore-keys: ${{ runner.os }}-sonar-scanner-

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -Path .sonar/scanner -ItemType Directory -Force
          dotnet tool update --tool-path .sonar/scanner dotnet-sonarscanner

      - name: SonarCloud Begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin `
            /k:"${{ env.SONAR_PROJECT_KEY }}" `
            /o:"${{ env.SONAR_ORG }}" `
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.projectBaseDir="${{ github.workspace }}" `
            /d:sonar.scanner.metadataFilePath="${{ runner.temp }}/sonar-metadata.json" `
            /d:sonar.sources="freela-match-api" `
            /d:sonar.tests="freela-match-api-test" `
            /d:sonar.test.inclusions="**/*.cs" `
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml" `
            /d:sonar.cs.vstest.reportsPaths="**/*.trx" `
            /d:sonar.exclusions="**/*Program.cs,**/*Migrations/*,**/*.dll,**/*obj/**,**/*bin/**" `
            /d:sonar.verbose=true

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_FILE }} --no-restore --configuration Release

      - name: Run tests + Generate coverage (forma mais estável de 2025)
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE

          dotnet test ${{ env.TEST_PROJECT }} `
            --no-build `
            --logger trx `
            --collect:"XPlat Code Coverage" `
            --results-directory:"./TestResults" `
            -- `
            DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=xml

          # Encontra o arquivo gerado pelo Coverlet
          $covFile = Get-ChildItem -Path "./TestResults" -Recurse -Filter "coverage.cobertura.xml" | Select-Object -First 1

          if (-not $covFile) {
            Write-Error "Arquivo de cobertura não foi gerado pelo Coverlet!"
            exit 1
          }

          Write-Host "Arquivo encontrado: $($covFile.FullName)"

          # Converte para o formato que o SonarCloud entende perfeitamente
          dotnet tool run dotnet-coverage merge $covFile.FullName --output coverage.xml --output-format xml

          if (Test-Path "coverage.xml") {
            Write-Host "coverage.xml gerado com sucesso na raiz do projeto!"
          } else {
            Write-Error "Falha ao converter o arquivo de cobertura!"
            exit 1
          }

      - name: Verify final coverage file
        run: |
          Get-ChildItem -Path . -Name coverage.xml
          Get-Content coverage.xml -Head 10

      - name: SonarCloud End
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  # Build rápido e barato (roda em paralelo)
  build:
    name: Build & Test (fast)
    needs: sonarcloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}
      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --no-restore --configuration Release
      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT }} --no-build --verbosity normal