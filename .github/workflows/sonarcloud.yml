name: SonarCloud Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read
  contents: read

jobs:
  Analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Remove conflicting files
        run: |
          rm -f sonar-project.properties
          echo "Arquivos .csproj encontrados:"
          find . -name "*.csproj"

      - name: Install SonarCloud scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore dependencies
        run: dotnet restore

      - name: Begin SonarCloud analysis
        run: |
          dotnet sonarscanner begin \
            /k:"AnnaBLoz_freelamatch-api" \
            /o:"annabloz" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.exclusions="**/Migrations/**" \
            /d:sonar.coverage.exclusions="**Tests*.cs,**/*Tests.cs,**/Program.cs" \
            /d:sonar.projectBaseDir="."

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run ALL tests with coverage
        run: |
          echo "Executando TODOS os testes com cobertura..."
          
          # Executa testes para TODA a solution com coverlet
          dotnet test \
            --configuration Release \
            --no-build \
            --verbosity normal \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=./coverage.opencover.xml \
            /p:Exclude="[*Tests]*,[*.Tests]*" \
            /p:ExcludeByFile="**/Migrations/**/*.cs"
          
          echo ""
          echo "Testes executados!"

      - name: Display coverage files
        if: always()
        run: |
          echo "=== Arquivos de cobertura gerados ==="
          find . -name "coverage.opencover.xml" -o -name "*.opencover.xml" | while read file; do
            echo "$file"
            echo "   Tamanho: $(wc -l < "$file") linhas"
            echo "   Primeiras linhas:"
            head -10 "$file"
            echo "---"
          done
          
          echo ""
          echo "=== Todos os arquivos XML (para debug) ==="
          find . -name "*.xml" -path "*/TestResults/*" -o -name "*coverage*.xml" | head -20

      - name: End SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Summary
        if: always()
        run: |
          echo "###Análise SonarCloud - Resumo" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Ver Relatório Completo](https://sonarcloud.io/dashboard?id=AnnaBLoz_freelamatch-api)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          COVERAGE_COUNT=$(find . -name "coverage.opencover.xml" 2>/dev/null | wc -l)
          
          if [ "$COVERAGE_COUNT" -gt 0 ]; then
            echo "**Cobertura de código enviada ao SonarCloud**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Arquivos gerados: $COVERAGE_COUNT" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Nenhum arquivo de cobertura detectado**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Verifique os logs acima para mais detalhes" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Testes executados:**" >> $GITHUB_STEP_SUMMARY