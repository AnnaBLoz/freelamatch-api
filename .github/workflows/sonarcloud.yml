name: SonarCloud Analysis
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  pull-requests: read
  contents: read
jobs:
  Analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner
        
      - name: Add Coverlet to test project
        run: |
          cd FreelaMatch.Tests
          dotnet add package coverlet.msbuild --version 6.0.0
          cd ..
        
      - name: Restore dependencies
        run: dotnet restore
          
      - name: Build
        run: dotnet build --configuration Release --no-restore
        
      - name: Test with coverage
        run: |
          dotnet test --configuration Release --verbosity normal \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=../coverage/ \
            FreelaMatch.Tests/FreelaMatch.Tests.csproj
            
      - name: Verify coverage file
        run: |
          echo "===== Coverage file verification ====="
          if [ -f "coverage/coverage.opencover.xml" ]; then
            echo "Coverage file found!"
            ls -lh coverage/coverage.opencover.xml
            echo ""
            echo "===== Coverage Summary ====="
            head -5 coverage/coverage.opencover.xml
          else
            echo "Coverage file NOT found"
            exit 1
          fi
        
      - name: Begin SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Limpando arquivos obj/bin..."
          find . -name "obj" -type d -exec rm -rf {} + 2>/dev/null || true
          find . -name "bin" -type d -exec rm -rf {} + 2>/dev/null || true
          dotnet sonarscanner begin \
            /k:"AnnaBLoz_freelamatch-api" \
            /o:"annabloz" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.opencover.reportsPaths="coverage/coverage.opencover.xml" \
            /d:sonar.exclusions="**/Migrations/**" \
            /d:sonar.coverage.exclusions="**/*Tests.cs,**/Program.cs,**/Migrations/**"
            
      - name: Build for SonarScanner
        run: dotnet build --configuration Release --force
          
      - name: End SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
        
      - name: Summary
        if: always()
        run: |
          echo "### SonarCloud Analysis Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Dashboard](https://sonarcloud.io/dashboard?id=AnnaBLoz_freelamatch-api)" >> $GITHUB_STEP_SUMMARY