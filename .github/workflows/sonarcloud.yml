name: Analyze .NET Backend

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build, Test, Coverage & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Add .NET global tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Restore dependencies
        run: dotnet restore

      - name: SonarCloud Begin
        run: |
          dotnet sonarscanner begin \
            /k:"AnnaBLoz_freelamatch-api" \
            /o:"annabloz" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.login="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs" \
            /d:sonar.test.inclusions="**/*Tests.cs"

      - name: Build
        run: dotnet build --configuration Release --no-incremental

      - name: Run tests and collect coverage
        run: |
          dotnet test FreelaMatch.Tests/FreelaMatch.Tests.csproj \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage"

      - name: Locate coverage file
        id: find_coverage
        run: |
          echo "Searching for coverage files..."
          found=$(find . -type f -name "coverage.cobertura.xml" | head -n 1)
          echo "Coverage file found at: $found"
          if [ -z "$found" ]; then
            echo "No coverage.cobertura.xml found!" && exit 1
          fi
          echo "coverage_path=$found" >> $GITHUB_OUTPUT

      - name: Convert Cobertura to OpenCover
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            "-reports:${{ steps.find_coverage.outputs.coverage_path }}" \
            "-targetdir:coverage-converted" \
            "-reporttypes:opencover"

      - name: Verify coverage report
        run: |
          echo "Preview of converted coverage file:"
          head -n 20 coverage-converted/opencover.xml

      - name: SonarCloud End
        run: |
          dotnet sonarscanner end \
            /d:sonar.login="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.opencover.reportsPaths="coverage-converted/opencover.xml"
